name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # wöchentlich: Daten neu laden. Hält auch den Zwischenspeicher am Leben,
    # GitHub löscht Caches, die 7 Tage lang nicht verwendet wurden.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # Zwischenspeicher der Rohdaten: schont die Quellserver (Übertritte und Ergebnisse werden
      # je Schule nur alle 90 Tage neu abgefragt) und dient als Rückfall, wenn eine Quelle ausfällt.
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: daten-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: daten-

      # Zeitbudget der Abfragen (40 min) bleibt unter dem Limit des Jobs
      - run: npm run data

      # Auch speichern, wenn ein späterer Schritt scheitert oder der Lauf abgebrochen wird:
      # sonst wären die schon abgefragten Schulen verloren
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: daten-${{ github.run_id }}-${{ github.run_attempt }}

      # Tage der offenen Tür von den Schulwebsites: freiwillig, ohne sie baut die Seite trotzdem
      - run: npm run tdot
        continue-on-error: true
        timeout-minutes: 15
      - run: npm run build
        env:
          SITE: https://${{ github.repository_owner }}.github.io
          BASE: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
