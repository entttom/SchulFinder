name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 1 * *' # monatlich: Daten neu laden
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # Zwischenspeicher der Rohdaten: schont die Quellserver (Übertritte werden nur
      # alle 90 Tage neu abgefragt) und dient als Rückfall, wenn eine Quelle ausfällt.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: daten-${{ github.run_id }}
          restore-keys: daten-

      - run: npm run data
      - run: npm run build
        env:
          SITE: https://${{ github.repository_owner }}.github.io
          BASE: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
